<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swiftpolis</title>
    <link rel="stylesheet" href="css/popup.css">
    <script src="js/popup.js" defer></script>
</head>
<body>
<main class="popup">
    <header class="masthead">
        <img class="mark" src="../icons/icon_128.png" alt="">
        <div>
            <h1>Swiftpolis</h1>
            <p class="status"><span class="status-dot"></span><span id="status-text">Catching file links</span></p>
        </div>
    </header>

    <label class="catch-card" for="catches-links">
        <span class="catch-text">
            <strong>Catch file links</strong>
            <span>Clicking a file sends it to Swiftpolis instead of Safari.</span>
        </span>
        <input class="switch" type="checkbox" id="catches-links" role="switch">
    </label>

    <section aria-label="This page">
        <h2>This page</h2>
        <div class="actions">
            <button type="button" class="action" id="all-links">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
                <span>All links</span>
            </button>
            <button type="button" class="action" id="selected-links">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>
                <span>Selected links</span>
            </button>
        </div>
    </section>

    <section aria-label="Settings">
        <h2>Settings</h2>
        <div class="settings">
            <label class="setting" id="context-menu-setting" for="context-menu">
                <span>Add to the right-click menu</span>
                <input class="switch" type="checkbox" id="context-menu" role="switch">
            </label>
            <label class="setting setting-stacked" for="keywords">
                <span>Leave links alone if they contain</span>
                <input class="field" id="keywords" type="text" placeholder=".jpg, .png, example.com"
                       autocomplete="off" autocapitalize="off" spellcheck="false">
            </label>
        </div>
    </section>

    <footer class="shortcuts">
        Hold <kbd>`</kbd> to let a click through. <kbd>⌃</kbd><kbd>⇧</kbd><kbd>U</kbd> switches catching on or off.
    </footer>
</main>
</body>
</html>
